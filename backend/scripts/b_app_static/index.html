<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>화학 안전문서 AI 결과 검토</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header id="app-header">
  <div id="app-heading" class="app-head"></div>
  <div id="global-context" class="context"></div>
  <nav id="main-nav" class="sidebar"></nav>
</header>
<main id="work" class="work">
  <div id="journey-notices" aria-live="polite"></div>
  <div id="journey-strip" class="journey-strip" hidden aria-live="polite"></div>
  <section id="screen-s01" hidden aria-labelledby="title-s01">
    <div id="journey-band" hidden></div>
    <h1 id="title-s01" tabindex="-1"></h1>
    <div id="score-summary"></div>
    <div id="score-problems"></div>
    <div id="score-history"></div>
    <div id="score-docs"></div>
    <div id="score-grid"></div>
    <div id="score-rows"></div>
    <div id="score-rule"></div>
    <div id="score-gaps"></div>
  </section>
  <section id="screen-s02" hidden aria-labelledby="title-s02">
    <h1 id="title-s02" tabindex="-1"></h1>
    <div id="source-top"></div>
    <div id="source-values"></div>
    <div id="source-page"></div>
    <div id="source-selection"></div>
  </section>
  <section id="screen-s03" hidden aria-labelledby="title-s03">
    <h1 id="title-s03" tabindex="-1"></h1>
    <div id="jobs-try"></div>
    <div id="jobs-result"></div>
    <div id="jobs-connection"></div>
  </section>
  <section id="screen-s04" hidden aria-labelledby="title-s04">
    <h1 id="title-s04" tabindex="-1"></h1>
    <div id="compare-summary"></div>
    <div id="compare-conditions"></div>
    <div id="compare-items"></div>
    <div id="compare-values"></div>
    <div id="compare-rows"></div>
    <div id="compare-prompts"></div>
  </section>
  <section id="screen-s05" hidden aria-labelledby="title-s05">
    <h1 id="title-s05" tabindex="-1"></h1>
    <div id="jobs-list"></div>
    <div id="jobs-detail"></div>
  </section>
  <section id="screen-s06" hidden aria-labelledby="title-s06">
    <h1 id="title-s06" tabindex="-1"></h1>
    <div id="servers-summary"></div>
    <div id="servers-models"></div>
    <div id="servers-rngd"></div>
    <div id="servers-runpod"></div>
    <div id="servers-log"></div>
  </section>
  <section id="screen-s07" hidden aria-labelledby="title-s07">
    <h1 id="title-s07" tabindex="-1"></h1>
    <div id="help-topics"></div>
    <div id="help-glossary"></div>
  </section>
  <section id="screen-s08" hidden aria-labelledby="title-s08">
    <h1 id="title-s08" tabindex="-1"></h1>
    <div id="journey-choice"></div>
    <div id="journey-records"></div>
  </section>
  <section id="screen-s09" hidden aria-labelledby="title-s09">
    <h1 id="title-s09" tabindex="-1"></h1>
    <div id="jobs-run"></div>
  </section>
  <section id="screen-s10" hidden aria-labelledby="title-s10">
    <h1 id="title-s10" tabindex="-1"></h1>
    <div id="jobs-compare"></div>
  </section>
</main>
<div id="tip" class="tip" role="tooltip" hidden></div>
<dialog id="context-picker" aria-labelledby="context-picker-title"></dialog>
<dialog id="action-confirm"></dialog>
<div id="status" role="status" aria-live="polite"></div>
<script id="ui-text" type="application/json">__B_APP_UI_TEXT__</script>
<script src="/static/js/core.js"></script>
<script src="/static/js/shell.js"></script>
<script src="/static/js/score.js"></script>
<script src="/static/js/source.js"></script>
<script src="/static/js/compare.js"></script>
<script src="/static/js/servers.js"></script>
<script src="/static/js/jobs.js"></script>
<script src="/static/js/journey.js"></script>
<script src="/static/js/boot.js"></script>
</body>
</html>
