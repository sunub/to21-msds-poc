# 모델 설정 (결정기록 D-37, D-42, D-44)
# 모델 이름·주소는 이 파일에서만 바꾼다. 코드에 직접 쓰지 않는다.
# 접속 정보(키, 주소)는 .env에서 읽는다. base_url_env / api_key_env는 .env의 변수 이름이다.
#
# structured: 구조화 출력을 시도하는 순서.
#   json_schema : 스키마 강제 출력 (response_format=json_schema)
#   json_object : JSON 응답만 강제하고 스키마는 프롬프트로 전달
#   none        : 강제 없이 프롬프트만. 응답을 받은 뒤 스키마로 검증한다
# 어느 방식이든 결과는 TO21 스키마로 다시 검증하고, 실패하면 오류 내용을 붙여 재시도한다(max_retries).

models:
  gpt:                      # 실버 1 (D-42)
    model: gpt-5.6-sol
    base_url_env: LLM_BASE_URL      # MonoRouter
    api_key_env: LLM_API_KEY
    token_param: max_completion_tokens   # GPT-5 계열 추론 모델의 출력 한도 이름
    structured: [json_schema, json_object, none]
    max_tokens: 64000
    params: {}              # 추론 강도 등은 모델 기본값 (D-42)
    image_detail: high
    evidence_method: vLM

  claude:                   # 실버 2 (D-42)
    model: claude-fable-5
    fallback_models: [claude-opus-5]   # 거절·오류가 반복되면 이 순서로 바꾼다
    base_url_env: LLM_BASE_URL
    api_key_env: LLM_API_KEY
    structured: [json_schema, json_object, none]
    max_tokens: 64000
    params: {}
    image_detail: high
    evidence_method: vLM

  qwen38:                   # 기준선 (D-37)
    model: Qwen/Qwen3.8-27B
    fallback_models: [Qwen/Qwen3.6-27B]
    base_url_env: VLLM_BASE_URL      # RunPod의 vLLM 서버 주소 (예: http://<pod>:8000/v1)
    api_key_env: VLLM_API_KEY
    structured: [json_schema, none]
    max_tokens: 32000
    params:
      temperature: 0
      extra_body:
        chat_template_kwargs: {enable_thinking: false}   # 생각 모드 끔 (D-37)
    image_detail: high
    evidence_method: vLM

  # --- 항목별 추출 비교 후보 (재계획 10/28). 항목 하나의 중간 형식은 짧아 max_tokens 8192면 충분하다.
  # concurrency: 문서 하나의 항목별 동시 호출 수. RNGD Qwen3-30B-A3B는 16개 동시에서 요청당 초당 약 136토큰 (10/28 측정)

  # RNGD furiosa-llm, 카드 4장
  qwen3_30b_a3b_rngd:
    model: furiosa-ai/Qwen3-30B-A3B-Instruct-2507-FP8
    base_url_env: RNGD_BASE_URL
    api_key_env: RNGD_API_KEY
    token_param: max_completion_tokens   # furiosa-llm에서 max_tokens는 옛 이름
    structured: [json_schema_compact, none]   # 처음부터 공백을 막는다. json_schema는 공백 폭주와 반복으로 한도에 걸린 뒤 압축으로 다시 보내 시간을 버렸다 (10/28, ADR-017)
    max_tokens: 8192
    concurrency: 16
    rows_sections: [3, 8, 9, 11, 12, 14, 15]   # 표 항목은 행 형식 글로 받는다. 14항은 TO21 필수. 이미지를 못 받아 image_input은 없다 (ADR-019)
    params: {temperature: 0}             # 지정하지 않으면 서버가 모델의 generation_config(1.0)를 쓴다

  # RNGD furiosa-llm, 카드 1장
  gpt_oss_20b_rngd:
    model: furiosa-ai/gpt-oss-20b
    base_url_env: RNGD_BASE_URL
    api_key_env: RNGD_API_KEY
    token_param: max_completion_tokens
    structured: [none]                   # json_schema를 켜면 추론을 건너뛰고 공백·말줄임표를 반복한다 (10/28 S003)
    max_tokens: 8192
    concurrency: 16
    params: {temperature: 0}

  # RNGD furiosa-llm, 카드 1장 (그림문자 판별, 10/31)
  qwen3vl4b_rngd:
    model: furiosa-ai/Qwen3-VL-4B-Instruct
    base_url_env: RNGD_BASE_URL
    api_key_env: RNGD_API_KEY
    token_param: max_completion_tokens
    structured: [json_schema, json_schema_compact, none]
    max_tokens: 8192
    concurrency: 16
    params: {temperature: 0}

  # RunPod vLLM 0.32.0
  qwen36_35b_runpod:
    model: Qwen/Qwen3.6-35B-A3B-FP8
    base_url_env: RUNPOD_VLLM_BASE_URL
    api_key_env: RUNPOD_VLLM_API_KEY
    structured: [json_schema, json_object, none]   # vLLM 0.32.0은 요청별 공백 금지를 무시한다. 서버를 공백 금지 설정(structured_outputs_config의 disable_any_whitespace)으로 띄운다 (ADR-017)
    max_tokens: 8192
    concurrency: 16
    rows_sections: [3, 8, 9, 11, 12, 14, 15]   # 표 항목은 행 형식 글로 받는다. 14항은 TO21 필수. 11·12·15항 JSON이 8,192토큰에서 잘렸다 (ADR-019)
    rows_max_tokens: 16384                 # 행 형식 호출의 출력 한도. 문법 강제가 없어 공백 폭주가 없다. M004 11항이 행 180줄로 8,192를 넘었다 (ADR-021)
    image_input: true                      # 2항 호출에 쪽 이미지를 붙여 그림문자를 읽게 한다 (ADR-019)
    params:
      temperature: 0
      extra_body:
        chat_template_kwargs: {enable_thinking: false}

  # RunPod vLLM 0.32.0
  nuextract2_8b_runpod:
    model: numind/NuExtract-2.0-8B
    base_url_env: RUNPOD_VLLM_BASE_URL
    api_key_env: RUNPOD_VLLM_API_KEY
    # 시스템 안내문 대신 chat_template_kwargs.template로 칸 틀을 받는다. ChatClient가 항별 스키마를 틀로 바꿔 보내고 다시 보내지 않는다 (ADR-010)
    request_style: nuextract_template
    structured: [none]
    max_tokens: 8192
    concurrency: 16
    params: {temperature: 0}

run:
  max_retries: 2            # 스키마 검증 실패 시 재시도 횟수
  request_timeout: 600      # 초
  render_dpi: 150           # 쪽 이미지 해상도 (D-44). 바꾸면 manifest note에도 기록
