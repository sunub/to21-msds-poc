# 실버(Claude 정답 초안)의 알려진 빈 곳. 점수판에서 항목 옆에 표시한다. A가 확인한 것만 적는다
# A 확인 전인 줄은 note 앞에 "확인 전"을 붙인다. A가 확인하면 지우고, 아니라고 하면 줄을 지운다
- item: "11항 급성독성"      # 채점 항목 이름 앞부분
  note: "실버가 값 없는 독성 행 232개 중 209개의 q를 비워 둔다(TO21 예제는 q.raw=자료없음). 우리 결과가 맞고 실버가 어긋난 경우가 있다"
  since: 2026-10-30
  source: "A 답변 10/30, docs/plan/받은문서/A_답변_빈칸20개_20261030.md"
- item: "8항 노출기준"
  note: "값 없는 노출기준 행의 기준 종류(TWA·BEI)는 A의 표기 규칙 함수가 기본값으로 채운 것이다(실버 52행). 기본값은 TO21 예제 1건에서 나왔고, 작은 골드가 나오면 A가 다시 맞춘다"
  since: 2026-10-30
  source: "A 답변 10/29·10/30(A-1, A-3), docs/plan/받은문서/A_답변_빈칸20개_20261030.md"
- item: "9항 필수 물성"
  note: "확인 전(B 추정). 개발용 실버의 물성 221행 중 66행이 값 없는 행이라 값 없는 행 표기 차이가 점수에 크게 닿는다. 실버는 이 66행의 q.raw를 모두 채워 두었고, 실버가 틀린 곳은 아직 찾지 않았다"
  since: 2026-10-30
  source: "ADR-022 트레이드오프, B 확인 10/30(개발용 10건)"
- item: "15항 국내 규제 기준농도"
  note: "확인 전(B 추정). 실버의 기준농도 단위가 행마다 '%'(13행)와 'wt%'(3행)로 다르다(개발용 10건). 원문 표기를 따른 것인지 A 확인 전이다. 채점기는 단위까지 맞춰 보므로 단위만 다른 행도 빠뜨림과 지어냄으로 잡힌다"
  since: 2026-10-30
  source: "ADR-022 트레이드오프, B 확인 10/30(개발용 10건)"
