# Qwen3.5-122B-A10B (큰 모델 비교 실험 한 번, Apache-2.0). 11/04 F
# 'Qwen3.6-122B'는 11/04 현재 공개되지 않았다(확인 필요). 같은 구조(qwen3_5_moe)인 3.5판을 쓴다.
# Qwen3.6-35B-A3B와 구조가 같아 학습 데이터도 같은 것을 쓴다: ft_build_data.py --student qwen36_35b_runpod
# MoE(256 전문가, 48층, 한 토큰에 약 10B 계산). 전문가 약 1,160억 개가 4bit로 줄지 않아 bf16 LoRA로 돌린다.
# bf16 가중치 약 244GB + 학습 중 약 15~20GB → GPU 여러 장에 나눠 올린다(device_map: auto).
#   권장: H200 141GB × 4(약 564GB, 넉넉). 다른 선택: B200 × 2, H100·A100 80GB × 4(320GB, 빠듯). 먼저 --check-memory.
#   나눠 올리면 한 번에 GPU 한 장씩 계산하므로 속도는 한 장과 비슷하다. 대략 시간은 --check-memory가 알려 준다.
# 디스크: 원본 약 250GB(+ 합치기를 하면 그만큼 더). 48층 중 36층이 Gated DeltaNet이다.
base: qlora.yaml
run_name: to21_lora_qwen35_122b_a10b_v1
base_model: Qwen/Qwen3.5-122B-A10B
chat_template_kwargs: {enable_thinking: false}   # qwen36_35b_runpod와 같게. 3.5판 틀이 이 인자를 받는지 --check-data의 '정답 자르기'로 확인
device_map: auto
quantization:
  load_in_4bit: false
lora:
  target_modules: [q_proj, k_proj, v_proj, o_proj, in_proj_qkv, in_proj_z, out_proj]
