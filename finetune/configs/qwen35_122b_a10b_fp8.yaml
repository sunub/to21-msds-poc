# Qwen3.5-122B-A10B FP8판을 GPU 한 장(B200 180GB)에서 LoRA로 학습한다 (큰 모델 비교 실험). 11/04 F
# 학습 데이터: ft_build_data.py --student qwen36_35b_runpod (35B와 같은 데이터)
#
# 왜 FP8판인가
# - bf16 원본은 약 244GB라 한 장에 안 들어가고, bitsandbytes 4bit는 MoE 전문가를 줄이지 못한다(qlora.yaml 주석).
# - Qwen/Qwen3.5-122B-A10B-FP8(블록 128 FP8, 약 125GB)은 transformers 5.22가 FP8 층 위에서 LoRA 학습을 지원한다.
#   FP8 가중치는 얼린 채로 두고, 입력 기울기만 FP8 가중치를 풀어서 계산한다(FP8LinearFunction·FP8GroupedMatmulFunction).
# - 학습 원본과 추론(vLLM FP8) 원본이 같아진다.
# 예상 메모리: FP8 가중치 약 125GB + 임베딩·출력층 bf16 약 3GB + 학습 중 약 10~15GB → B200 180GB 한 장(먼저 --check-memory).
#   H200 141GB 한 장은 빠듯하다. B200이 없으면 RTX PRO 6000 96GB 2장에 나눈다: --set device_map=auto
#   (GPU 여러 장의 FP8은 transformers가 Triton 커널을 쓴다. 한 번에 한 장씩 계산해 속도는 한 장 기준이다.)
# 필요: FP8 계산 커널(kernels 패키지가 kernels-community/finegrained-fp8을 Pod에서 받는다, requirements.txt).
#   지금 torch 판에 맞는 커널이 없으면 모델을 올릴 때 ImportError가 난다(확인 필요).
# 48층 중 36층이 Gated DeltaNet이다. LoRA는 주의·DeltaNet 투영에 붙는다.
base: qlora.yaml
run_name: to21_lora_qwen35_122b_a10b_fp8_v1
base_model: Qwen/Qwen3.5-122B-A10B-FP8
chat_template_kwargs: {enable_thinking: false}   # qwen36_35b_runpod와 같게. --check-memory 앞부분의 '정답 자르기'로 확인
quantization:
  load_in_4bit: false               # 체크포인트가 이미 FP8이다(config.json의 quantization_config를 transformers가 읽는다)
lora:
  target_modules: [q_proj, k_proj, v_proj, o_proj, in_proj_qkv, in_proj_z, out_proj]
train:
  optim: adamw_torch                # LoRA 가중치만이라 상태가 작다. bitsandbytes 최적화기를 쓰지 않아 새 GPU(B200) 지원을 따지지 않는다
