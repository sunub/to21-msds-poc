# 추출 모델 LoRA 공통 설정 (11/03 F, 11/04 모델별 설정). 모델별 설정 파일이 'base: qlora.yaml'로 이 파일을 읽고 다른 값만 덮는다.
#   qwen3_30b_a3b.yaml   RNGD 운영 모델의 원본(MoE, bf16 LoRA)
#   qwen36_35b_a3b.yaml  RunPod 추론 모델의 원본(MoE, bf16 LoRA, Gated DeltaNet 층 포함)
#   qwen38_27b.yaml      기준선 모델(밀집, 4bit QLoRA, Gated DeltaNet 층 포함)
# 먼저 --check-data(길이)와 --check-memory(가장 긴 예시 한 걸음의 최대 메모리)로 본 뒤 학습한다.
# 값을 바꿔 다시 돌릴 때는 run_name도 바꾼다. 결과 폴더가 <output_dir>/<run_name>/ 이다.

run_name: to21_qlora_v1
output_dir: finetune/out            # 저장소에 올리지 않는다 (.gitignore)

# 원본(bf16) 체크포인트를 쓴다. -FP8·-AWQ 같은 양자화본은 학습에 못 쓴다.
#   예: RNGD에서 쓰는 furiosa-ai/Qwen3-30B-A3B-Instruct-2507-FP8 → Qwen/Qwen3-30B-A3B-Instruct-2507
#       RunPod에서 쓰는 Qwen/Qwen3.6-35B-A3B-FP8 → Qwen/Qwen3.6-35B-A3B
base_model: Qwen/Qwen3-30B-A3B-Instruct-2507
trust_remote_code: false
# 추론 설정(backend/configs/models.yaml 그 태그의 params.extra_body.chat_template_kwargs)과 같게 둔다.
# 생각 모드가 있는 모델(Qwen3 혼합형 등)은 {enable_thinking: false}. 다르면 학습 글과 추론 글의 앞부분이 달라진다.
chat_template_kwargs: {}

max_seq_len: 16384                  # 이보다 긴 예시는 자르지 않고 뺀다(--check-data로 먼저 길이를 본다)
attn_implementation: sdpa           # flash-attn을 깔았으면 flash_attention_2
device_map: null                    # 기본은 GPU 0 한 장. 여러 장에 모델을 나눠 올리려면 auto

quantization:                       # QLoRA: 원본을 4bit(NF4)로 올리고 LoRA만 학습한다
  load_in_4bit: true
  quant_type: nf4
  double_quant: true
  # 4bit로 줄지 않은 bf16 매개변수를 fp32로 바꿀지(peft 기본은 바꿈). auto: 늘어나는 크기가 upcast_max_gb 이하일 때만 바꾼다.
  # transformers 5의 MoE 전문가는 nn.Linear가 아니라 4bit로 줄지 않는다. 바꾸면 Qwen3-30B-A3B는 58GB가 116GB가 되어 넘친다 (11/04)
  upcast_rest: auto
  upcast_max_gb: 16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  # 주의(attention) 투영만 학습한다. Qwen3·Llama 계열은 밀집·MoE 모두 이름이 같다.
  # Qwen3.5·3.6·3.8 계열은 4층 중 3층이 Gated DeltaNet이라 그 층 이름(in_proj_qkv, in_proj_z, out_proj)을 더한다(모델별 설정).
  # MoE의 전문가(experts) 층은 수가 많아 메모리·시간이 크게 늘고, vLLM LoRA 지원도 모델마다 달라 넣지 않는다.
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  exclude_modules: ".*(visual|vision).*"   # 멀티모달 모델의 이미지 쪽 층은 건드리지 않는다

train:
  epochs: 2
  lr: 1.0e-4
  scheduler: cosine
  warmup: 0.05                      # 1보다 작으면 전체 단계 대비 비율
  weight_decay: 0.0
  max_grad_norm: 1.0
  batch_size: 1
  grad_accum: 8                     # 한 번에 반영하는 예시 수 = batch_size × grad_accum
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  bf16: true
  logging_steps: 5
  eval_steps: 25
  save_steps: 50
  eval_before: true                 # 학습 전 검증 손실도 남긴다(전후 비교)
  completion_logits_only: true      # 정답 자리의 logits만 만든다(손실 값은 같고, 긴 예시의 메모리가 크게 준다)
  seed: 2026

# 학습 곡선 보기(선택). 켜려면 enabled: true 또는 실행할 때 --set wandb.enabled=true
# 키는 RunPod에서 `export WANDB_API_KEY=...`(또는 wandb login)로만 둔다. 저장소·채팅·노션에 적지 않는다.
# 보내는 것: 손실·학습률·기울기 크기·GPU 사용량, 설정, 예시 수·길이 통계(숫자). 학습 글과 모델 파일은 보내지 않는다(D-47).
wandb:
  enabled: false
  project: to21-msds-qlora
  entity: null                      # 팀 W&B 조직에 남기려면 그 이름
  tags: []
