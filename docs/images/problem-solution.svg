<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'NanumGothic', sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<filter id="sh" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/></filter></defs>
<rect width="1200" height="780" fill="#ffffff"/>
<rect x="80" y="18" width="430" height="34" rx="17" fill="#e11d48"/><text x="295" y="41" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">기업이 겪는 문제</text>
<rect x="590" y="18" width="440" height="34" rx="17" fill="#0f172a"/><text x="810" y="41" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">해결 방법</text>
<rect x="1050" y="18" width="110" height="34" rx="17" fill="#64748b"/><text x="1105" y="41" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">맡는 쪽</text>
<circle cx="46" cy="121.0" r="17" fill="#0f172a"/><text x="46" y="127.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<g filter="url(#sh)"><rect x="80" y="72" width="430" height="98" rx="14" fill="#fff1f2" stroke="#fb7185" stroke-width="1.6"/></g>
<text x="102" y="102" font-size="16.5" font-weight="700" fill="#9f1239">형식이 제각각</text>
<text x="102" y="129" font-size="13.5" fill="#881337">같은 국가의 문서도 표와 문단 배치가</text>
<text x="102" y="150" font-size="13.5" fill="#881337">회사마다 달라 사람이 읽고 옮겨 적음</text>
<line x1="518" y1="121.0" x2="582" y2="121.0" stroke="#64748b" stroke-width="2.6" marker-end="url(#a)"/>
<g filter="url(#sh)"><rect x="590" y="72" width="440" height="98" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/></g>
<rect x="590" y="82.0" width="7" height="78.0" fill="#7c3aed"/>
<text x="616" y="102" font-size="16.5" font-weight="700" fill="#0f172a">스키마로 옮기고 근거 줄을 남김</text>
<text x="616" y="129" font-size="13.5" fill="#334155">스캔본·글자 깨진 PDF는 OCR과 표 복원으로</text>
<text x="616" y="150" font-size="13.5" fill="#334155">읽어 TO21 v0.6 JSON으로 만듦</text>
<rect x="1050" y="106.0" width="110" height="30" rx="15" fill="#7c3aed"/><text x="1105" y="126.0" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">AI</text>
<circle cx="46" cy="238.0" r="17" fill="#0f172a"/><text x="46" y="244.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<g filter="url(#sh)"><rect x="80" y="189" width="430" height="98" rx="14" fill="#fff1f2" stroke="#fb7185" stroke-width="1.6"/></g>
<text x="102" y="219" font-size="16.5" font-weight="700" fill="#9f1239">오류가 항 사이에 숨어 있음</text>
<text x="102" y="246" font-size="13.5" fill="#881337">2항 분류와 3항 함량이 안 맞거나</text>
<text x="102" y="267" font-size="13.5" fill="#881337">11항 독성 자료가 2항과 모순됨</text>
<line x1="518" y1="238.0" x2="582" y2="238.0" stroke="#64748b" stroke-width="2.6" marker-end="url(#a)"/>
<g filter="url(#sh)"><rect x="590" y="189" width="440" height="98" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/></g>
<rect x="590" y="199.0" width="7" height="78.0" fill="#16a34a"/>
<text x="616" y="219" font-size="16.5" font-weight="700" fill="#0f172a">혼합물 분류를 계산해 교차 대조</text>
<text x="616" y="246" font-size="13.5" fill="#334155">3항 성분·함량과 지식DB로 계산해</text>
<text x="616" y="267" font-size="13.5" fill="#334155">2항 기재와 15항 규제를 비교</text>
<rect x="1050" y="223.0" width="110" height="30" rx="15" fill="#16a34a"/><text x="1105" y="243.0" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">규칙 엔진</text>
<circle cx="46" cy="355.0" r="17" fill="#0f172a"/><text x="46" y="361.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<g filter="url(#sh)"><rect x="80" y="306" width="430" height="98" rx="14" fill="#fff1f2" stroke="#fb7185" stroke-width="1.6"/></g>
<text x="102" y="336" font-size="16.5" font-weight="700" fill="#9f1239">가장 위험한 건 과소분류</text>
<text x="102" y="363" font-size="13.5" fill="#881337">위험성을 실제보다 낮게 적은 문서를</text>
<text x="102" y="384" font-size="13.5" fill="#881337">놓치면 사용 기업에 큰 문제가 생김</text>
<line x1="518" y1="355.0" x2="582" y2="355.0" stroke="#64748b" stroke-width="2.6" marker-end="url(#a)"/>
<g filter="url(#sh)"><rect x="590" y="306" width="440" height="98" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/></g>
<rect x="590" y="316.0" width="7" height="78.0" fill="#16a34a"/>
<text x="616" y="336" font-size="16.5" font-weight="700" fill="#0f172a">심각도로 위험한 것부터 올림</text>
<text x="616" y="363" font-size="13.5" fill="#334155">일치·불일치·경계·근거부족으로 나누고</text>
<text x="616" y="384" font-size="13.5" fill="#334155">과소분류와 규제 누락을 먼저 표시</text>
<rect x="1050" y="340.0" width="110" height="30" rx="15" fill="#16a34a"/><text x="1105" y="360.0" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">규칙 엔진</text>
<circle cx="46" cy="472.0" r="17" fill="#0f172a"/><text x="46" y="478.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<g filter="url(#sh)"><rect x="80" y="423" width="430" height="98" rx="14" fill="#fff1f2" stroke="#fb7185" stroke-width="1.6"/></g>
<text x="102" y="453" font-size="16.5" font-weight="700" fill="#9f1239">법령은 개정됨</text>
<text x="102" y="480" font-size="13.5" fill="#881337">어느 시점의 기준으로 검증했는지</text>
<text x="102" y="501" font-size="13.5" fill="#881337">관리해야 함</text>
<line x1="518" y1="472.0" x2="582" y2="472.0" stroke="#64748b" stroke-width="2.6" marker-end="url(#a)"/>
<g filter="url(#sh)"><rect x="590" y="423" width="440" height="98" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/></g>
<rect x="590" y="433.0" width="7" height="39.0" fill="#16a34a"/>
<rect x="590" y="472.0" width="7" height="39.0" fill="#d97706"/>
<text x="616" y="453" font-size="16.5" font-weight="700" fill="#0f172a">판정마다 규칙·지식DB 버전 기록</text>
<text x="616" y="480" font-size="13.5" fill="#334155">규칙표 확정, 지식DB 버전 승인,</text>
<text x="616" y="501" font-size="13.5" fill="#334155">법령 개정 반영은 사람이 결정</text>
<rect x="1050" y="438.0" width="110" height="30" rx="15" fill="#16a34a"/><text x="1105" y="458.0" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">규칙 엔진</text>
<rect x="1050" y="476.0" width="110" height="30" rx="15" fill="#d97706"/><text x="1105" y="496.0" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">사람</text>
<circle cx="46" cy="589.0" r="17" fill="#0f172a"/><text x="46" y="595.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<g filter="url(#sh)"><rect x="80" y="540" width="430" height="98" rx="14" fill="#fff1f2" stroke="#fb7185" stroke-width="1.6"/></g>
<text x="102" y="570" font-size="16.5" font-weight="700" fill="#9f1239">범용 AI는 믿고 맡기기 어려움</text>
<text x="102" y="597" font-size="13.5" fill="#881337">같은 질문에도 답이 달라지고 원문에 없는</text>
<text x="102" y="618" font-size="13.5" fill="#881337">값을 지어내며 국내 법령에 최적화되지 않음</text>
<line x1="518" y1="589.0" x2="582" y2="589.0" stroke="#64748b" stroke-width="2.6" marker-end="url(#a)"/>
<g filter="url(#sh)"><rect x="590" y="540" width="440" height="98" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/></g>
<rect x="590" y="550.0" width="7" height="39.0" fill="#7c3aed"/>
<rect x="590" y="589.0" width="7" height="39.0" fill="#16a34a"/>
<text x="616" y="570" font-size="16.5" font-weight="700" fill="#0f172a">AI는 읽고 설명만, 판정은 규칙</text>
<text x="616" y="597" font-size="13.5" fill="#334155">유해 여부는 AI가 정하지 않고</text>
<text x="616" y="618" font-size="13.5" fill="#334155">같은 입력이면 같은 판정이 나옴</text>
<rect x="1050" y="555.0" width="110" height="30" rx="15" fill="#7c3aed"/><text x="1105" y="575.0" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">AI</text>
<rect x="1050" y="593.0" width="110" height="30" rx="15" fill="#16a34a"/><text x="1105" y="613.0" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">규칙 엔진</text>
<circle cx="46" cy="706.0" r="17" fill="#0f172a"/><text x="46" y="712.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<g filter="url(#sh)"><rect x="80" y="657" width="430" height="98" rx="14" fill="#fff1f2" stroke="#fb7185" stroke-width="1.6"/></g>
<text x="102" y="687" font-size="16.5" font-weight="700" fill="#9f1239">처음부터 끝까지 읽어야 함</text>
<text x="102" y="714" font-size="13.5" fill="#881337">비용이 크고 위험한 오류를</text>
<text x="102" y="735" font-size="13.5" fill="#881337">놓칠 수 있음</text>
<line x1="518" y1="706.0" x2="582" y2="706.0" stroke="#64748b" stroke-width="2.6" marker-end="url(#a)"/>
<g filter="url(#sh)"><rect x="590" y="657" width="440" height="98" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/></g>
<rect x="590" y="667.0" width="7" height="78.0" fill="#d97706"/>
<text x="616" y="687" font-size="16.5" font-weight="700" fill="#0f172a">위험한 항목부터 근거와 함께 확인</text>
<text x="616" y="714" font-size="13.5" fill="#334155">불일치를 확정·승인하고</text>
<text x="616" y="735" font-size="13.5" fill="#334155">저장·대외 회신의 최종 책임은 사람</text>
<rect x="1050" y="691.0" width="110" height="30" rx="15" fill="#d97706"/><text x="1105" y="711.0" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">사람</text>
</svg>